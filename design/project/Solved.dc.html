<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solved puzzle page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Besley:wght@500;700;900&amp;family=Kalam:wght@400;700&amp;family=Libre+Franklin:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.pb{--paper:#f4efe3;--paper-2:#ebe4d3;--print:#1c1a17;--print-soft:#5c564c;--line:#8f887a;--pen:#1d3f8f;--pencil:#615c54;--hl:#f3e58a;--stamp:#b3261e;--on-print:#f4efe3}
.pb.dark{--paper:#1f1c18;--paper-2:#2a2621;--print:#ece5d6;--print-soft:#a9a194;--line:#6a6358;--pen:#9db9f5;--pencil:#aaa398;--hl:#4d4619;--stamp:#f08a7c;--on-print:#1f1c18}
</style>
</helmet>
<div class="pb {{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 16px; background: var(--paper); color: var(--print); font-family: 'Libre Franklin', sans-serif; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--print); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; padding-right: 12px; text-decoration: none"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><path d="M9 2L4 7l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Contents</a>
<span>Riddles</span>
</header>

<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">Nonogram · 10×10</span>
<h1 style="margin: 0; font-family: 'Besley', serif; font-weight: 900; font-size: 34px; line-height: 1">No. 30592</h1>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-bottom: 3px">
<div aria-hidden="true" style="display: flex; gap: 4px">
<span style="width: 10px; height: 10px; background: var(--print); border: 1.5px solid var(--print); box-sizing: border-box"></span>
<span style="width: 10px; height: 10px; background: var(--print); border: 1.5px solid var(--print); box-sizing: border-box"></span>
<span style="width: 10px; height: 10px; background: var(--print); border: 1.5px solid var(--print); box-sizing: border-box"></span>
</div>
<span style="font-family: 'Besley', serif; font-weight: 500; font-size: 15px">Hard</span>
</div>
</div>

<div style="position: relative; display: grid; grid-template-columns: 65px minmax(0, 1fr); grid-template-rows: 65px auto">
<div></div>
<div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); padding: 0 2.5px">
<sc-for list="{{colClues}}" as="k" hint-placeholder-count="10">
<div style="display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 1px; padding-bottom: 5px; box-sizing: border-box; font-family: 'Besley', serif; font-weight: 700; font-size: 14px; line-height: 15px"><sc-for list="{{k.nums}}" as="n" hint-placeholder-count="2"><span>{{n}}</span></sc-for></div>
</sc-for>
</div>
<div style="display: grid; grid-template-rows: repeat(10, minmax(0, 1fr)); padding: 2.5px 0">
<sc-for list="{{rowClues}}" as="k" hint-placeholder-count="10">
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 7px; padding-right: 7px; box-sizing: border-box; font-family: 'Besley', serif; font-weight: 700; font-size: 14px; line-height: 1"><sc-for list="{{k.nums}}" as="n" hint-placeholder-count="2"><span>{{n}}</span></sc-for></div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); border: 2.5px solid var(--print); background: var(--paper)">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="100">
<div style="position: relative; aspect-ratio: 1; box-sizing: border-box; {{c.css}}">
<sc-if value="{{c.filled}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 2px; background: var(--pen); border-radius: 3px 2px 3px 2px"></span></sc-if>
</div>
</sc-for>
</div>
<h2 style="position: absolute; right: 6px; bottom: 28px; margin: 0; padding: 4px 14px 2px; border: 5px double var(--stamp); border-radius: 6px; background: var(--paper); color: var(--stamp); font-family: 'Besley', serif; font-weight: 900; font-size: 44px; line-height: 1.1; letter-spacing: 0.08em; text-transform: uppercase; transform: rotate(-9deg)">Solved</h2>
</div>

<div style="display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; margin-top: 6px">
<button style="height: 58px; background: var(--print); color: var(--on-print); border: 0; border-radius: 2px; font-family: 'Besley', serif; font-weight: 700; font-size: 18px">Next puzzle</button>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; box-sizing: border-box; border: 1.5px solid var(--print); border-radius: 2px; text-decoration: none; font-family: 'Besley', serif; font-weight: 700; font-size: 16px">Contents</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const solution = ['....#.....', '....##....', '....###...', '....####..', '....#####.', '....#.....', '##########', '.########.', '..######..', '##..##..##'];
const runs = (line) => {
const out = [];
let n = 0;
for (const ch of line + '.') {
if (ch === '#') n++;
else if (n) { out.push(String(n)); n = 0; }
}
return out.length ? out : ['0'];
};
const rowClues = solution.map((row) => ({ nums: runs(row) }));
const colClues = [];
for (let c = 0; c < 10; c++) {
colClues.push({ nums: runs(solution.map((row) => row[c]).join('')) });
}
const cells = [];
for (let r = 0; r < 10; r++) {
for (let c = 0; c < 10; c++) {
let css = '';
if (c < 9) css += 'border-right: ' + (c % 5 === 4 ? '2px solid var(--print)' : '1px solid var(--line)') + ';';
if (r < 9) css += 'border-bottom: ' + (r % 5 === 4 ? '2px solid var(--print)' : '1px solid var(--line)') + ';';
cells.push({ filled: solution[r][c] === '#', css: css });
}
}
return { theme: (this.props.dark ?? false) ? 'dark' : '', cells: cells, rowClues: rowClues, colClues: colClues };
}
}
</script>
</body>
</html>
